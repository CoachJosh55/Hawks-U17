<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Warwickshire Hawks U17 — Defensive Glossary</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,400;0,600;0,700;0,900;1,700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --navy: #1A1F8C;
    --navy-dark: #0F1260;
    --navy-mid: #252AA0;
    --gold: #D4A017;
    --gold-light: #F0BB30;
    --gold-pale: #FBF0CC;
    --white: #ffffff;
    --off-white: #F5F5F8;
    --text: #1a1a2e;
    --text-light: #5a5a7a;
    --border: #dde0f0;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--off-white);
    color: var(--text);
    font-family: 'Barlow', sans-serif;
    line-height: 1.6;
  }

  h1, h2, h3, h4 {
    font-family: 'Barlow Condensed', sans-serif;
    letter-spacing: 0.02em;
  }

  /* ─── HERO ─────────────────────────────────────── */
  .hero {
    background: var(--navy);
    color: var(--white);
    padding: 0;
    position: relative;
  }

  .hero::before {
    content: '';
    position: absolute;
    inset: 0;
    background: repeating-linear-gradient(
      -45deg,
      transparent,
      transparent 40px,
      rgba(255,255,255,0.02) 40px,
      rgba(255,255,255,0.02) 80px
    );
    pointer-events: none;
  }

  .hero-inner {
    max-width: 1040px;
    margin: 0 auto;
    padding: 56px 32px 48px;
    display: grid;
    grid-template-columns: 1fr auto;
    gap: 40px;
    align-items: center;
    position: relative;
  }

  .hero-logo {
    width: 130px;
    height: 130px;
    border-radius: 50%;
    border: 4px solid var(--gold);
    object-fit: cover;
    object-position: center center;
    box-shadow: 0 0 40px rgba(212,160,23,0.35);
    flex-shrink: 0;
    display: block;
  }

  .hero-eyebrow {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 0.85rem;
    font-weight: 700;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--gold);
    margin-bottom: 10px;
  }

  .hero h1 {
    font-size: clamp(2.8rem, 6vw, 4.8rem);
    font-weight: 900;
    line-height: 0.95;
    color: var(--white);
    margin-bottom: 20px;
    text-transform: uppercase;
  }

  .hero h1 span {
    color: var(--gold);
    font-style: italic;
  }

  .hero-sub {
    font-size: 1.1rem;
    color: rgba(255,255,255,0.75);
    max-width: 520px;
    line-height: 1.7;
  }

  .hero-bar {
    background: var(--gold);
    height: 6px;
  }

  /* ─── CONTAINER ─────────────────────────────────── */
  .container {
    max-width: 1040px;
    margin: 0 auto;
    padding: 0 32px;
  }

  .section { padding: 64px 0; }

  .section-label {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 0.8rem;
    font-weight: 700;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--gold);
    margin-bottom: 8px;
  }

  .section-title {
    font-size: clamp(1.8rem, 4vw, 2.6rem);
    font-weight: 900;
    text-transform: uppercase;
    color: var(--navy);
    margin-bottom: 32px;
  }

  /* ─── SEARCH ─────────────────────────────────────── */
  .search-wrap {
    position: relative;
    margin-bottom: 40px;
  }

  .search-wrap svg {
    position: absolute;
    left: 20px;
    top: 50%;
    transform: translateY(-50%);
    color: var(--text-light);
    pointer-events: none;
  }

  #termSearch {
    width: 100%;
    padding: 16px 24px 16px 52px;
    border-radius: 999px;
    border: 2px solid var(--border);
    background: var(--white);
    font-family: 'Barlow', sans-serif;
    font-size: 1rem;
    color: var(--text);
    outline: none;
    transition: border-color 0.2s, box-shadow 0.2s;
    box-shadow: 0 2px 8px rgba(26,31,140,0.04);
  }

  #termSearch::placeholder { color: var(--text-light); }

  #termSearch:focus {
    border-color: var(--gold);
    box-shadow: 0 4px 16px rgba(212,160,23,0.15);
  }

  /* ─── FILTER PILLS ───────────────────────────────── */
  .filter-row {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    margin-bottom: 36px;
    align-items: center;
  }

  .filter-label {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 0.8rem;
    font-weight: 700;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: var(--text-light);
    margin-right: 4px;
  }

  .pill {
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 700;
    font-size: 0.8rem;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    padding: 6px 16px;
    border-radius: 999px;
    border: 2px solid var(--border);
    background: var(--white);
    color: var(--text-light);
    cursor: pointer;
    transition: all 0.2s;
  }

  .pill:hover { border-color: var(--navy); color: var(--navy); }

  .pill.active {
    background: var(--navy);
    border-color: var(--navy);
    color: var(--white);
  }

  /* ─── RESULTS COUNT ──────────────────────────────── */
  .results-count {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 0.85rem;
    font-weight: 700;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--text-light);
    margin-bottom: 20px;
  }

  .results-count span { color: var(--navy); }

  /* ─── GLOSSARY GRID ──────────────────────────────── */
  .glossary-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
    gap: 16px;
  }

  /* ─── TERM CARD ──────────────────────────────────── */
  .term-card {
    background: var(--white);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 22px 24px;
    cursor: pointer;
    transition: transform 0.2s, box-shadow 0.2s, border-color 0.2s, background 0.2s;
    border-left: 6px solid var(--navy);
    position: relative;
  }

  .term-card:hover {
    transform: translateY(-3px);
    box-shadow: 0 8px 24px rgba(26,31,140,0.1);
    border-color: var(--navy);
  }

  .term-card-header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 12px;
  }

  .term-card h3 {
    font-size: 1.4rem;
    font-weight: 900;
    font-style: italic;
    text-transform: uppercase;
    color: var(--navy);
    line-height: 1.1;
    letter-spacing: -0.3px;
  }

  .term-chevron {
    color: var(--gold);
    font-size: 1rem;
    font-weight: 900;
    flex-shrink: 0;
    margin-top: 3px;
    transition: transform 0.3s;
  }

  .category-tag {
    display: inline-block;
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 0.7rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    padding: 3px 10px;
    border-radius: 4px;
    background: var(--gold-pale);
    color: var(--navy);
    margin-top: 6px;
  }

  .term-def {
    margin-top: 14px;
    padding-top: 14px;
    border-top: 1px solid var(--off-white);
    color: var(--text-light);
    font-size: 0.95rem;
    line-height: 1.6;
    display: none;
    animation: fadeUp 0.25s ease;
  }

  /* Active state */
  .term-card.active {
    background: var(--navy-dark);
    border-color: var(--navy-dark);
    border-left-color: var(--gold);
    transform: translateY(-3px);
    box-shadow: 0 8px 28px rgba(15,18,96,0.25);
  }

  .term-card.active h3 { color: var(--gold); }

  .term-card.active .category-tag {
    background: rgba(212,160,23,0.2);
    color: var(--gold-light);
  }

  .term-card.active .term-def {
    display: block;
    color: rgba(255,255,255,0.82);
    border-top-color: rgba(255,255,255,0.1);
  }

  .term-card.active .term-chevron { transform: rotate(90deg); }

  /* No results */
  .no-results {
    grid-column: 1 / -1;
    text-align: center;
    padding: 60px 20px;
    color: var(--text-light);
  }

  .no-results h3 {
    font-size: 1.6rem;
    color: var(--navy);
    margin-bottom: 8px;
    font-style: italic;
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(6px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  /* ─── FOOTER ─────────────────────────────────────── */
  footer {
    background: var(--navy-dark);
    color: rgba(255,255,255,0.5);
    text-align: center;
    padding: 32px;
    font-size: 0.88rem;
    margin-top: 20px;
  }

  footer strong { color: rgba(255,255,255,0.8); }

  /* ─── RESPONSIVE ──────────────────────────────────── */
  @media (max-width: 768px) {
    .hero-inner { grid-template-columns: 1fr; text-align: center; }
    .hero-logo { margin: 0 auto; }
    .glossary-grid { grid-template-columns: 1fr; }
    .container { padding: 0 16px; }
  }
</style>
</head>

<!-- ─── MAIN ───────────────────────────────────────── -->
<section class="section container">
  <div class="section-label">U17 · 2026/27 Season</div>
  <h2 class="section-title">Defensive Glossary</h2>

  <!-- Search -->
  <div class="search-wrap">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
    </svg>
    <input type="text" id="termSearch" placeholder="Search terms — e.g. 'Ice', 'Screen', 'Gap'…" autocomplete="off">
  </div>

  <!-- Filter pills -->
  <div class="filter-row">
    <span class="filter-label">Filter:</span>
    <button class="pill active" data-cat="all">All Terms</button>
    <button class="pill" data-cat="stance">Stance & Body</button>
    <button class="pill" data-cat="court">Court Zones</button>
    <button class="pill" data-cat="screen">Ball Screens</button>
    <button class="pill" data-cat="rotation">Rotations</button>
  </div>

  <!-- Count -->
  <div class="results-count" id="resultsCount"></div>

  <!-- Grid -->
  <div class="glossary-grid" id="glossaryGrid"></div>
</section>

<!-- ─── FOOTER ─────────────────────────────────────── -->
<footer>
  <p>© 2026 <strong>Warwickshire Hawks Basketball</strong>. Developing the whole person through the game.</p>
</footer>

<script>
  const glossary = [
    { term: "No Middle",       cat: "court",    def: "Don't allow ball handlers to drive through the middle. If they beat you, force to the other side of the paint — never concede the lane." },
    { term: "Close Out",       cat: "stance",   def: "Sprint and stutter to the ball to contest a 3pt shot. Soft contest. Force teams to prove they can make 3s. Don't leave your feet unless instructed." },
    { term: "Boxer Stance",    cat: "stance",   def: "High foot positioning used to funnel the offensive player towards help. Active, aggressive base." },
    { term: "Airplane Stance", cat: "stance",   def: "Arms wide when off-ball to deflect passes and close off sightlines. Take up maximum space without fouling." },
    { term: "Hands",           cat: "stance",   def: "Coach shout: every player raises hands with open palms to deflect passes. Reminder: 'get hands out of the cookie jar.'" },
    { term: "Cylinder",        cat: "stance",   def: "Stay directly vertical with body and arms to avoid fouls during layup contests. Do not lean." },
    { term: "Chest Out",       cat: "stance",   def: "Close out with chest high to create contact. Less likely to be called for a foul than using only high hands." },
    { term: "Gap",             cat: "rotation", def: "Defender stays in the middle between the ball and their man (typically 1 pass away) — ready to help or recover." },
    { term: "Wolf",            cat: "screen",   def: "Trap, typically off an iced or weaked ball screen. Cover tightly with an arm up to deter skip passes." },
    { term: "Help",            cat: "rotation", def: "Usually the low man or 'goalie' in the Home position, guarding the weak-side furthest offensive player." },
    { term: "Top Lock",        cat: "stance",   def: "Facing a great shooter: angle body to the high side to prevent catches above the 3pt line. Force baseline only." },
    { term: "Home",            cat: "court",    def: "Head under the basket on a fast break. The anchor position — the 'get home' destination for the deepest defender." },
    { term: "Middle Third",    cat: "court",    def: "Paint lines extended outward — the dead zone. We must never allow a drive or pass to cut through here." },
    { term: "Side Thirds",     cat: "court",    def: "Target areas on either side of the middle third where we funnel ball handlers to force turnovers and difficult shots." },
    { term: "Ice",             cat: "screen",   def: "On a ball screen: force the ball handler to the sideline and baseline — take away the middle entirely. Big calls it, Guard complies." },
    { term: "Clipped",         cat: "screen",   def: "Danger zone: when the ball defender gets hit by a screen, allowing the handler to turn the corner. Must be communicated immediately." },
    { term: "Reject",          cat: "screen",   def: "When the ball handler avoids the screen to attack middle. Must not be allowed — this beats our coverage." },
    { term: "Weak",            cat: "screen",   def: "On a ball screen: force the ball handler to their left hand. Big calls it, Guard complies. Works alongside Ice." },
    { term: "Drop",            cat: "screen",   def: "Big defender coverage: shadow the ball while staying within arm's reach of the screener. Sag to protect the rim." },
    { term: "Under",           cat: "screen",   def: "Ball handler defender goes underneath the screen — used when not concerned about the shot and want to protect against drives." },
    { term: "Over",            cat: "screen",   def: "Ball handler defender fights over the top of the screen to take away the shot and force into the help defender." },
    { term: "Cover 2",         cat: "rotation", def: "A single defender covering two offensive players — one in the corner, one cutting. Requires elite timing and awareness." },
    { term: "Crackback",       cat: "rotation", def: "The Cover 2 defender sprinting to rotate back to a back cutter from the corner. Don't allow the free cut." },
    { term: "Full Rotation",   cat: "rotation", def: "Cover 2 closes out to a shooter — all other defenders must rotate together to cover the open man. No one stands still." },
    { term: "Stunt & Recover", cat: "rotation", def: "In the gap: stunt toward the ball or shooter to cause hesitation, buying time for a teammate to close out or rotate back." },
    { term: "Strong Side",     cat: "court",    def: "The side of the floor where the ball is currently located. Everyone must be aware of the ball side at all times." },
    { term: "Weak Side",       cat: "court",    def: "The side of the floor away from the ball. Our help defenders live here — ready to rotate." },
    { term: "Front Court",     cat: "court",    def: "The offensive half of the court — where we score. On defence, this is the opponent's attacking half." },
    { term: "Back Court",      cat: "court",    def: "The defensive half of the court — where we protect. Getting 'home' means getting back here first." },
  ];

  const catLabels = {
    all:      "Defense",
    stance:   "Stance & Body",
    court:    "Court Zones",
    screen:   "Ball Screens",
    rotation: "Rotations",
  };

  const grid       = document.getElementById('glossaryGrid');
  const searchEl   = document.getElementById('termSearch');
  const countEl    = document.getElementById('resultsCount');
  const pills      = document.querySelectorAll('.pill');

  let activeCategory = 'all';

  function render() {
    const q = searchEl.value.toLowerCase().trim();
    const filtered = glossary.filter(item => {
      const matchSearch = item.term.toLowerCase().includes(q) || item.def.toLowerCase().includes(q);
      const matchCat    = activeCategory === 'all' || item.cat === activeCategory;
      return matchSearch && matchCat;
    });

    countEl.innerHTML = `Showing <span>${filtered.length}</span> of <span>${glossary.length}</span> terms`;
    grid.innerHTML = '';

    if (filtered.length === 0) {
      grid.innerHTML = `
        <div class="no-results">
          <h3>No Terms Found</h3>
          <p>Try a different search or filter.</p>
        </div>`;
      return;
    }

    filtered.forEach(item => {
      const card = document.createElement('div');
      card.className = 'term-card';
      card.innerHTML = `
        <div class="term-card-header">
          <div>
            <h3>${item.term}</h3>
            <span class="category-tag">${catLabels[item.cat]}</span>
          </div>
          <span class="term-chevron">▶</span>
        </div>
        <p class="term-def">${item.def}</p>
      `;
      card.querySelector('.term-card-header').addEventListener('click', () => {
        card.classList.toggle('active');
      });
      grid.appendChild(card);
    });
  }

  pills.forEach(pill => {
    pill.addEventListener('click', () => {
      pills.forEach(p => p.classList.remove('active'));
      pill.classList.add('active');
      activeCategory = pill.dataset.cat;
      render();
    });
  });

  searchEl.addEventListener('input', render);

  render();
</script>

</body>
</html>
